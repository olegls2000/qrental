<div th:fragment="depositPage">
    <nav th:replace="fragments/navigationFragment.html :: qrental-navigation"></nav>
    <h2 class="py-3">Deposits</h2>
    <table class="table table-striped table-bordered">
        <tr>
            <th style="width: 1% !important;">
                <a class="btn btn-sm btn-success"
                   href="/deposits/add-form"
                   role="button"
                   aria-controls="offcanvasExample">
                    <span class="bi-plus-circle"></span>
                </a>
            </th>
            <th style="width: 1% !important;">Delete</th>
            <th>Amount</th>
            <th>Driver's name</th>
            <th>Driver's tax number</th>
            <th>Created at</th>
            <th>Comment</th>
        </tr>
        <tr th:if="${#lists.isEmpty(deposits)}">
            <td colspan="5">No Deposit replenishments</td>
        </tr>
        <tr th:each="deposit : ${deposits}">
            <td class="text-center">
                <a class="btn btn-sm btn-warning"
                   th:href="@{/deposits/update-form/{id}(id=${deposit.id})}">
                    <span class="bi-pencil-square"></span>
                </a>
            </td>
            <td class="text-center">
                <a class="btn btn-sm btn-danger"
                   th:href="@{/deposits/delete-form/{id}(id=${deposit.id})}">
                    <span class="bi-trash"></span>
                </a>
            </td>
            <td th:text="${deposit.amount}"></td>
            <td th:text="|${deposit.driverFirstName} ${deposit.driverLastName}|"></td>
            <td th:text="${deposit.driverTaxNumber}"></td>
            <td th:text="${qDateFormatter.format(deposit.createdOn)}">???</td>
            <td th:text="${deposit.comment}"></td>
        </tr>
    </table>
</div>
