<div th:fragment="assembledBrandingVerificationCalculation" class="row mt-5">
    <div class="col-12">
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Verification Control Calculation Results</h4>
                <div class="row">
                    <div class="col">
                        <a class="btn-close position-absolute top-0 end-0 m-2"
                           aria-label="Close"
                           href="/cars/verification-control-calculations">
                        </a>
                    </div>
                </div>
                <table class="table table-striped table-bordered mt-3">
                    <tr>
                        <th>Action Date</th>
                        <th>Driver</th>
                        <th>Car</th>
                        <th>Branding Expiration Date</th>
                    </tr>
                    <tr th:if="${#lists.isEmpty(calculationResults)}">
                        <td colspan="4">No Verification Control Calculation Results</td>
                    </tr>
                    <tr th:each="calculationResult : ${calculationResults}">
                        <td th:text="${qDateFormatter.format(calculationResult.actionDate)}">???</td>
                        <td th:text="|${calculationResult.driverFirstName} ${calculationResult.driverLastName}|">???</td>
                        <td th:text="${calculationResult.carRegNumber}">???</td>
                        <td th:text="${qDateFormatter.format(calculationResult.brandingExpirationDate)}">???</td>
                    </tr>
                </table>
            </div>
        </div>
    </div>
</div>
