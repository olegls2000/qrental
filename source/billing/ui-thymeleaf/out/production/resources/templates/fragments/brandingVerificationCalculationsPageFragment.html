<div th:fragment="calculationsPage">
    <nav th:replace="fragments/navigationFragment.html :: qrental-navigation"></nav>
    <ul th:replace="fragments/carTabFragment.html :: carTabs('verificationControlCalculations')"></ul>
    <h2 class="py-3">Verification Control Calculations</h2>
    <table class="table table-striped table-bordered">
        <tr>
            <th style="width: 1% !important;">
                <a class="btn btn-sm btn-success"
                   href="/cars/verification-control-calculations/add-form"
                   role="button"
                   aria-controls="offcanvasExample">
                    <span class="bi bi-calculator"></span>
                </a>
            </th>
            <th>Action Date</th>
            <th>Type</th>
            <th>Verifications Count</th>
        </tr>
        <tr th:if="${#lists.isEmpty(calculations)}">
            <td colspan="4">No Verification Control Calculations were done yet</td>
        </tr>
        <tr th:each="calculation : ${calculations}">
            <td>
                <a class="btn btn-sm btn-warning"
                   th:href="@{/cars/verification-control-calculations/{id}(id=${calculation.calculationId})}">
                    <span class="bi bi-card-checklist"></span>
                </a>
            </td>
            <td th:text="${qDateFormatter.format(calculation.actionDate)}">???</td>
            <td th:text="${calculation.type}">???</td>
            <td th:text="${calculation.verificationsCount}">???</td>
        </tr>
    </table>
</div>
