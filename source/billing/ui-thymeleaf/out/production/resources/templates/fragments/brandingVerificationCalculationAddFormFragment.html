<div th:fragment="assembledForm">
    <div th:replace="fragments/commonFormFragment.html :: commonForm(
            title='Trigger Verification Report calculation',
            content=~{fragments/brandingVerificationCalculationAddFormFragment.html :: addForm},
            request=${addRequest}
        )">
    </div>
</div>

<div th:fragment="addForm">
    <form method="post"
          th:action="@{/cars/verification-control-calculations/add}"
          th:object="${addRequest}">
        <p class="fs-4 ">Please confirm that you want to trigger:</p>
        <ul class="list-group list-group-flush">
            <li class="list-group-item">Branding verification report calculation</li>
            <li class="list-group-item">Branding notification</li>
        </ul>
        <div class="mb-3">
            <label class="form-label text-muted" for="dateId">Date</label>
            <input class="form-control" id="dateId"
                   th:field="*{date}"
                   type="date"
                   readonly/>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted" for="typeId">Report Type</label>
            <input class="form-control" id="typeId"
                   th:field="*{type}"
                   type="text"
                   readonly/>
        </div>
        <div class="mb-3">
            <label class="form-label text-muted" for="actionDateId">Action Date</label>
            <input class="form-control" id="actionDateId"
                   th:field="*{actionDate}"
                   type="date"
                   readonly/>
        </div>
        <div th:replace="fragments/addUpdateFormButtonsFragment.html :: addUpdateButtons(
            submitValue='Calculate')">
        </div>
    </form>
</div>
