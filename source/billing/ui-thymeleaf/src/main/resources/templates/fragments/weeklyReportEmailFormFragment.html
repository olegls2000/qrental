<div th:fragment="assembledForm">
    <div th:replace="fragments/commonFormFragment.html :: commonForm(
            title='Send Weekly Report by Email',
            content=~{fragments/weeklyReportEmailFormFragment.html :: confirmationForm},
            request=${emailSendRequest}
        )">
    </div>
</div>

<form th:fragment="confirmationForm"
      th:action="@{/reports/email/send}"
      th:object="${emailSendRequest}"
      method="post">
    <input id="reportId" required
           th:field="*{id}"
           type="text"
           hidden/>
    <div class="row">
        <div class="col">
            <div class="mb-3">
                <p id="infoTextId" class="fs-6 text-center">Are you sure want to send the Weekly by email to
                    Driver? </p>
            </div>
        </div>
    </div>
    <div class="row justify-content-center">
        <div class="col-2">
            <input class="btn btn-success"
                   type="submit"
                   value="Send">
        </div>
        <div class="col-2">
            <a class="btn btn-secondary" href="/reports">Cancel</a>
        </div>
    </div>
</form>
