<div th:fragment="weeklyReportPage">
    <nav th:replace="fragments/navigationFragment.html :: qrental-navigation"></nav>
    <ul th:replace="fragments/weeklyReportTabFragment :: weeklyReportTabs('weekly-reports')"></ul>
    <h2 class="py-3">WeeklyReports</h2>
    <table class="table table-striped table-bordered">
        <tr>
            <th>Actions</th>
            <th>Year</th>
            <th>Week</th>
            <th>Comment</th>
        </tr>
        <tr th:if="${#lists.isEmpty(reports)}">
            <td colspan="5">No Weekly Reports</td>
        </tr>
        <tr th:each="report : ${reports}">
            <td>
                <a class="btn btn-sm btn-info"
                   th:href="@{/invoices/pdf/{id}(id=${report.id})}">
                    <span class="bi-file-earmark-pdf"></span>
                    View</a>
                <a class="btn btn-sm btn-warning"
                   th:href="@{/reports/email/send-form/{id}(id=${report.id})}">
                    <span class="bi bi-envelope-at"></span>
                    Send</a>
            </td>
            <td th:text="${report.year}"></td>
            <td th:text="${report.weekNumber}"></td>
            <td th:text="${report.comment}"></td>
        </tr>
    </table>
</div>
